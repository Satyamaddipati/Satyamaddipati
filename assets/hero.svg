<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Satya Maddipati</title>
  <desc id="desc">Animated banner for a software and applied AI portfolio</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171613"/>
      <stop offset=".58" stop-color="#24211c"/>
      <stop offset="1" stop-color="#3a241b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff7547" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ff7547" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .orbit{transform-origin:960px 165px;animation:spin 18s linear infinite}
      .orbit2{transform-origin:960px 165px;animation:spinback 12s linear infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      .blink{animation:blink 1.1s steps(2,end) infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinback{to{transform:rotate(-360deg)}}
      @keyframes pulse{50%{opacity:.45;transform:scale(.96)}}
      @keyframes blink{50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.blink{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="20" r="210" fill="url(#glow)" filter="url(#soft)" opacity=".55"/>

  <g opacity=".17" stroke="#f7f3ec">
    <path d="M0 66H1200M0 132H1200M0 198H1200M0 264H1200"/>
    <path d="M100 0V330M200 0V330M300 0V330M400 0V330M500 0V330M600 0V330M700 0V330M800 0V330M900 0V330M1000 0V330M1100 0V330"/>
  </g>

  <g transform="translate(66 68)">
    <text class="mono" x="0" y="0" fill="#ff7547" font-size="15" letter-spacing="3">HELLO / NAMASTE</text>
    <text class="sans" x="0" y="72" fill="#fffaf2" font-size="60" font-weight="750" letter-spacing="-2">Satya Maddipati</text>
    <text class="sans" x="2" y="117" fill="#cfc8bd" font-size="22">software × applied AI × curious systems</text>
    <text class="mono" x="2" y="170" fill="#9e978d" font-size="14">MS COMPUTER SCIENCE · UW–MADISON</text>
    <rect class="blink" x="390" y="157" width="9" height="17" rx="1" fill="#ff7547"/>
  </g>

  <g>
    <circle class="pulse" cx="960" cy="165" r="58" fill="none" stroke="#ff7547" stroke-width="2"/>
    <circle cx="960" cy="165" r="12" fill="#ff7547"/>
    <circle class="orbit" cx="960" cy="78" r="7" fill="#fffaf2"/>
    <circle class="orbit" cx="960" cy="252" r="5" fill="#ff7547"/>
    <circle class="orbit2" cx="884" cy="165" r="6" fill="#d7cfc3"/>
    <circle class="orbit2" cx="1036" cy="165" r="4" fill="#ff9c7b"/>
    <circle cx="960" cy="165" r="88" fill="none" stroke="#fffaf2" stroke-opacity=".22"/>
    <circle cx="960" cy="165" r="116" fill="none" stroke="#ff7547" stroke-opacity=".28" stroke-dasharray="5 10"/>
    <path d="M948 165h24M960 153v24" stroke="#171613" stroke-width="3"/>
    <text class="mono" x="1100" y="293" fill="#9e978d" font-size="11" text-anchor="end">BUILD / TEST / LEARN / REPEAT</text>
  </g>
</svg>
